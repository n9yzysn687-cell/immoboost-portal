name: HER12 Profile Switch Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Trace profile switch
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const page=await context.newPage();page.setDefaultTimeout(12000);
          const tap=async l=>{await l.waitFor({state:'visible'});await l.scrollIntoViewIfNeeded();const b=await l.boundingBox();await page.touchscreen.tap(b.x+b.width/2,b.y+b.height/2);await page.waitForTimeout(150)};
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',e.message));
          let dialogs=0;
          page.on('dialog',async d=>{dialogs++;console.log('DIALOG',d.type(),JSON.stringify(d.message()));await d.accept()});
          await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?diag=profile-switch-v20',{waitUntil:'domcontentloaded',timeout:20000});
          await page.locator('.v15ProfileGate').waitFor({state:'visible'});await tap(page.locator('[data-sex="male"]'));await tap(page.locator('[data-run="3"]'));
          const root=page.locator('.her4Onboarding');await root.waitFor({state:'visible'});for(const day of ['0','2','4']){const b=root.locator(`.her4Days [data-day="${day}"]`);if(!await b.evaluate(el=>el.classList.contains('active')))await tap(b)}
          await tap(root.locator('[data-step="1"] [data-next="2"]'));await root.locator('.her4Step[data-step="3"]').waitFor({state:'visible'});await tap(root.locator('#her4Create'));await root.waitFor({state:'detached'});
          await page.locator('#v15ProfileChip').waitFor({state:'visible'});
          console.log('BEFORE',await page.evaluate(()=>({meta:localStorage.getItem('HER12_META_V15'),slot:localStorage.getItem('HER12_PROFILE_SLOTS_V16'),gate:!!document.querySelector('.v15ProfileGate'),chip:document.querySelector('#v15ProfileChip')?.textContent,url:location.href})));
          await tap(page.locator('#v15ProfileChip'));
          await page.waitForTimeout(2500);
          console.log('AFTER',await page.evaluate(()=>({meta:localStorage.getItem('HER12_META_V15'),profile:localStorage.getItem('HER12_PROFILE_V4'),state:localStorage.getItem('HER12_PRIVATE_V2')?.slice(0,80)||null,slot:localStorage.getItem('HER12_PROFILE_SLOTS_V16')?.slice(0,260)||null,gate:!!document.querySelector('.v15ProfileGate'),gateVisible:!!document.querySelector('.v15ProfileGate')&&getComputedStyle(document.querySelector('.v15ProfileGate')).display!=='none',chip:document.querySelector('#v15ProfileChip')?.textContent||null,url:location.href,ready:document.readyState})));
          console.log('DIALOG_COUNT',dialogs);
          await browser.close();
          EOF
          node diag.mjs
