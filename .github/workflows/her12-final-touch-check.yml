name: HER12 V15 Crash Stack

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture crash stack
        run: |
          cat > her12-stack.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          page.on('pageerror',e=>console.log('PAGEERROR_STACK='+(e.stack||e.message)));
          page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR='+m.text())});
          await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?stack=1',{waitUntil:'domcontentloaded',timeout:15000});
          await page.waitForTimeout(4000);
          console.log('GATE='+await page.locator('.v15ProfileGate').count());
          await browser.close();
          EOF
          node her12-stack.mjs
