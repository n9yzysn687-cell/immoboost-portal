name: HER12 Vercel CI Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel CI credentials without exposing values
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN_PRESENT=yes"; else echo "VERCEL_TOKEN_PRESENT=no"; fi
          if [ -n "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID_PRESENT=yes"; else echo "VERCEL_ORG_ID_PRESENT=no"; fi
          if [ -n "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID_PRESENT=yes"; else echo "VERCEL_PROJECT_ID_PRESENT=no"; fi
