name: HER12 Clean Static Host Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Inspect jsDelivr HTML delivery
        run: |
          cat > static-host.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://cdn.jsdelivr.net/gh/n9yzysn687-cell/immoboost-portal@697d1adab2b554190eecf84728e6ef5654b08e97/public/her12/index.html';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          page.on('pageerror',e=>console.log('PAGEERROR='+e.message));
          page.on('console',m=>console.log('CONSOLE_'+m.type()+'='+m.text()));
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
          console.log('STATUS='+response?.status());
          console.log('CONTENT_TYPE='+await response?.headerValue('content-type'));
          console.log('TITLE='+await page.title());
          console.log('BODY='+JSON.stringify((await page.locator('body').innerText()).slice(0,250)));
          console.log('URL='+page.url());
          await context.close();await browser.close();
          EOF
          node static-host.mjs
