name: HER12 Pages Validation Host

on:
  push:
    branches: [her12-live-check]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: her12-pages-validation
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout HER12 release candidate
        uses: actions/checkout@v4
        with:
          ref: her12-v15-release
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload HER12 only
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/her12
      - name: Deploy HER12 validation host
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Print validation URL
        run: echo "HER12_PAGES_URL=${{ steps.deployment.outputs.page_url }}"
