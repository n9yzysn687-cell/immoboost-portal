name: HER12 Boot Runtime Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture runtime without waiting for UI
        run: |
          cat > her12-boot.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const errors = [];
          const requests = [];
          page.on('pageerror', e => { const text = 'PAGEERROR ' + (e.stack || e.message); errors.push(text); console.log(text); });
          page.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') { const text = 'CONSOLE_' + m.type().toUpperCase() + ' ' + m.text(); errors.push(text); console.log(text); } });
          page.on('requestfinished', r => { if (/her12|index-|v14|v15/i.test(r.url())) requests.push('OK ' + r.url()); });
          page.on('requestfailed', r => { requests.push('FAIL ' + r.url() + ' ' + (r.failure()?.errorText || '')); });
          try {
            await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?boot-runtime=1', { waitUntil: 'domcontentloaded', timeout: 15000 });
            console.log('DOMCONTENTLOADED');
          } catch (e) {
            console.log('GOTO_ERROR ' + e.message);
          }
          await new Promise(resolve => setTimeout(resolve, 6000));
          console.log('REQUESTS=' + JSON.stringify(requests));
          console.log('ERRORS=' + JSON.stringify(errors));
          try {
            const state = await Promise.race([
              page.evaluate(() => ({
                ready: document.readyState,
                classes: document.documentElement.className,
                gate: !!document.querySelector('.v15ProfileGate'),
                layers: [...document.querySelectorAll('script[data-her12-layer]')].map(s => s.dataset.her12Layer),
                body: (document.body?.innerText || '').slice(0, 800),
              })),
              new Promise((_, reject) => setTimeout(() => reject(new Error('evaluate timeout')), 2000)),
            ]);
            console.log('STATE=' + JSON.stringify(state));
          } catch (e) {
            console.log('STATE_ERROR ' + e.message);
          }
          await browser.close();
          EOF
          node her12-boot.mjs
