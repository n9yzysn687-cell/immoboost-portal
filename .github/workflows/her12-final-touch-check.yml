name: HER12 Vercel Preview Resolver

on:
  push:
    branches: [her12-live-check]

jobs:
  resolve:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vercel preview aliases
        run: |
          urls=(
            "https://immoboost-portal-git-her12-v15-release-n9yzysn687-cells-projects.vercel.app/her12/"
            "https://immoboost-portal-git-her12-v15-release.vercel.app/her12/"
            "https://herfit12-git-her12-v15-release-n9yzysn687-cells-projects.vercel.app/her12/"
          )
          for url in "${urls[@]}"; do
            echo "URL=$url"
            code=$(curl -L -sS -o /tmp/her12-body -w '%{http_code}' --max-time 15 "$url" || true)
            type=$(curl -L -sSI --max-time 15 "$url" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2; exit}')
            echo "STATUS=$code CONTENT_TYPE=${type:-unknown}"
            head -c 180 /tmp/her12-body | tr '\n' ' '; echo
          done
