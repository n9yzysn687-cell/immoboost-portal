name: HER12 V15 Bundle Probe

on:
  push:
    branches: [her12-live-check]

jobs:
  probe:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public bundle
        run: |
          set -euo pipefail
          BASE='https://her12-1plk7r.v2.appdeploy.ai'
          curl -fsSL "$BASE/?bundle-probe=1" -o /tmp/root.html
          echo '=== ROOT ==='
          sed -n '1,80p' /tmp/root.html
          ASSET=$(grep -oE 'src="[^"]+\.js"' /tmp/root.html | head -1 | cut -d'"' -f2)
          echo "ASSET=$ASSET"
          curl -fsSL "$BASE/${ASSET#./}" -o /tmp/app.js
          echo '=== MAIN FLAGS ==='
          grep -o 'her12-v15[^"'"' ]*' /tmp/app.js | head -20 || true
          grep -n 'v15ProfileGate' /tmp/app.js | head -3 || true
          echo '=== DIRECT V15 ==='
          curl -fsSL "$BASE/her12-v15.js" -o /tmp/v15.js
          grep -n 'v15ProfileGate' /tmp/v15.js | head -3
          echo '=== LOCAL BASE ==='
          curl -fsSL "$BASE/her12-base/index.txt" -o /tmp/base.txt
          grep -n 'HER12' /tmp/base.txt | head -3
          echo 'HER12_V15_BUNDLE_PROBE_OK'
