name: HER12 Visual Viewport Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Inspect visual viewport
        run: |
          cat > visual-viewport.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?visual-viewport=1', { waitUntil: 'domcontentloaded', timeout: 15000 });
          const values = await page.evaluate(() => ({
            innerWidth,
            innerHeight,
            outerWidth,
            outerHeight,
            screenWidth: screen.width,
            screenHeight: screen.height,
            vv: visualViewport ? {
              width: visualViewport.width,
              height: visualViewport.height,
              offsetTop: visualViewport.offsetTop,
              offsetLeft: visualViewport.offsetLeft,
              pageTop: visualViewport.pageTop,
              scale: visualViewport.scale,
            } : null,
          }));
          console.log('VIEWPORT=' + JSON.stringify(values));
          await context.close();
          await browser.close();
          EOF
          node visual-viewport.mjs
