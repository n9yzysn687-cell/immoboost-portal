name: HER12 Vercel Deployment Resolver

on:
  push:
    branches: [her12-live-check]

jobs:
  resolve:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Resolve Vercel deployment environment URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha='fc8dd0ea64718c109a75eeb7f75f422b670c3bc9'
          base='https://api.github.com/repos/n9yzysn687-cell/immoboost-portal'
          req=urllib.request.Request(f'{base}/deployments?sha={sha}&per_page=20', headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=15) as r:
              deployments=json.load(r)
          print('DEPLOYMENTS='+str(len(deployments)))
          for dep in deployments:
              dep_id=dep.get('id')
              print('DEPLOYMENT_ID='+str(dep_id)+' ENV='+str(dep.get('environment'))+' REF='+str(dep.get('ref')))
              req=urllib.request.Request(f'{base}/deployments/{dep_id}/statuses?per_page=20', headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  statuses=json.load(r)
              for st in statuses:
                  print('STATE='+str(st.get('state'))+' ENV_URL='+str(st.get('environment_url'))+' LOG_URL='+str(st.get('log_url')))
          PY
