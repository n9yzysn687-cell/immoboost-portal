name: HER12 Public Asset Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public V15 v17 asset
        run: |
          url='https://her12-1plk7r.v2.appdeploy.ai/her12-v15.js?v=17'
          code=$(curl -L -sS -o /tmp/v15.js -w '%{http_code}' --max-time 20 "$url")
          echo "HTTP=$code BYTES=$(wc -c </tmp/v15.js)"
          echo "HAS_PATCH=$(grep -q 'patchTrackingProfile' /tmp/v15.js && echo yes || echo no)"
          echo "HAS_PECTORAUX=$(grep -q 'Pectoraux' /tmp/v15.js && echo yes || echo no)"
          echo "HAS_FEMALE_GATE=$(grep -q 'Qui va utiliser HER12' /tmp/v15.js && echo yes || echo no)"
          grep -n -m1 'patchTrackingProfile\|Pectoraux' /tmp/v15.js || true
