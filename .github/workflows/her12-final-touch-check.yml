name: HER12 V15 Post-Fix Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture runtime state
        run: |
          cat > her12-postfix.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.stack||e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?postfix-diag=1',{waitUntil:'domcontentloaded',timeout:15000});
          await new Promise(r=>setTimeout(r,4000));
          const state=await page.evaluate(()=>({
            layers:[...document.querySelectorAll('script[data-her12-layer]')].map(s=>s.dataset.her12Layer),
            gate:document.querySelectorAll('.v15ProfileGate').length,
            femaleButton:document.querySelectorAll('[data-sex="female"]').length,
            maleButton:document.querySelectorAll('[data-sex="male"]').length,
            onboarding:document.querySelectorAll('.her4Onboarding').length,
            v14Settings:document.querySelectorAll('#v14SettingsCard').length,
            v15Ready:document.documentElement.classList.contains('her15-ready'),
            htmlClass:document.documentElement.className,
            meta:localStorage.getItem('HER12_META_V15')
          }));
          console.log('STATE='+JSON.stringify(state));
          console.log('ERRORS='+JSON.stringify(errors));
          await browser.close();
          EOF
          node her12-postfix.mjs
