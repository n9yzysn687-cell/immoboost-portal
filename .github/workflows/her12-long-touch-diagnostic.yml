name: HER12 Late Profile Touch Diagnostic

on:
  push:
    branches: [her12-live-check]

jobs:
  diagnose:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Trace late profile touch
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const page=await context.newPage();page.setDefaultTimeout(12000);
          const tap=async l=>{await l.waitFor({state:'visible'});await l.scrollIntoViewIfNeeded();const b=await l.boundingBox();await page.touchscreen.tap(b.x+b.width/2,b.y+b.height/2);await page.waitForTimeout(130)};
          let dialogs=0;page.on('dialog',async d=>{dialogs++;console.log('DIALOG',JSON.stringify(d.message()));await d.accept()});
          await page.goto('https://her12-1plk7r.v2.appdeploy.ai/?diag=late-profile-touch',{waitUntil:'domcontentloaded',timeout:20000});
          await page.evaluate(()=>{window.__HER12_EVENT_TRACE=[];for(const type of ['pointerdown','pointerup','touchstart','touchend','click'])document.addEventListener(type,e=>{const t=e.target;window.__HER12_EVENT_TRACE.push({type,target:t instanceof Element?(t.id||t.tagName):String(t),path:e.composedPath().slice(0,4).map(x=>x instanceof Element?(x.id||x.tagName):String(x)).join('>')})},true)});
          await page.locator('.v15ProfileGate').waitFor({state:'visible'});await tap(page.locator('[data-sex="male"]'));await tap(page.locator('[data-run="3"]'));
          const root=page.locator('.her4Onboarding');await root.waitFor({state:'visible'});for(const day of ['0','2','4']){const b=root.locator(`.her4Days [data-day="${day}"]`);if(!await b.evaluate(el=>el.classList.contains('active')))await tap(b)}await tap(root.locator('[data-step="1"] [data-next="2"]'));await root.locator('.her4Step[data-step="3"]').waitFor({state:'visible'});await tap(root.locator('#her4Create'));await root.waitFor({state:'detached'});
          await tap(page.locator('.bottom .nav[data-nav="program"]'));for(let i=0;i<3;i++)await tap(page.locator('#sessionTabs button').nth(i));await tap(page.locator('#sessionTabs button').first());await tap(page.locator('#exerciseList .exerciseRow').first());if(await page.locator('#v6Warmup').isVisible().catch(()=>false))await tap(page.locator('#v6Warmup [data-warm="skip"]'));await tap(page.locator('#setRows .setCheck').first());await tap(page.locator('#timerSkip'));await tap(page.locator('#backExercise'));
          for(const nav of ['tracking','more','home','program'])await tap(page.locator(`.bottom .nav[data-nav="${nav}"]`));await tap(page.locator('.bottom .nav[data-nav="tracking"]'));await tap(page.locator('#v11Progress .v11BodyCard button:visible'));await page.locator('#body').waitFor({state:'visible'});await page.locator('#mWeight').fill('101.1');await tap(page.locator('#saveMeasures'));await tap(page.locator('.bottom .nav[data-nav="home"]'));
          const chip=page.locator('#v15ProfileChip');await chip.waitFor({state:'visible'});const b=await chip.boundingBox();const x=b.x+b.width/2,y=b.y+b.height/2;
          console.log('CHIP_BOX',b,'POINT',x,y);
          console.log('ELEMENTS_AT_POINT',await page.evaluate(({x,y})=>document.elementsFromPoint(x,y).slice(0,8).map(el=>({tag:el.tagName,id:el.id,cls:el.className,pe:getComputedStyle(el).pointerEvents,vis:getComputedStyle(el).visibility,z:getComputedStyle(el).zIndex})),{x,y}));
          await page.evaluate(()=>window.__HER12_EVENT_TRACE=[]);
          await page.touchscreen.tap(x,y);await page.waitForTimeout(2500);
          console.log('DIALOGS',dialogs);
          console.log('EVENTS',await page.evaluate(()=>window.__HER12_EVENT_TRACE));
          console.log('STATE',await page.evaluate(()=>({meta:localStorage.getItem('HER12_META_V15'),slot:!!localStorage.getItem('HER12_PROFILE_SLOTS_V16'),gate:!!document.querySelector('.v15ProfileGate'),gateVisible:!!document.querySelector('.v15ProfileGate')&&getComputedStyle(document.querySelector('.v15ProfileGate')).display!=='none',chip:document.querySelector('#v15ProfileChip')?.textContent||null})));
          await browser.close();
          EOF
          node diag.mjs
