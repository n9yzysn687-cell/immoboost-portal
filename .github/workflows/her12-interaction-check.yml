name: HER12 Real Interaction Check

on:
  push:
    branches: [her12-live-check]

jobs:
  iphone:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Exercise HER12 like a first-time iPhone user
        run: |
          cat > her12-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:3, isMobile:true, hasTouch:true});
          const errors=[]; const logs=[];
          page.on('pageerror', e=>errors.push('PAGEERROR '+e.message));
          page.on('console', m=>{ if(m.type()==='error') errors.push('CONSOLE '+m.text()); });
          await page.goto('https://herfit12.vercel.app/?e2e=first-run',{waitUntil:'networkidle',timeout:60000});
          logs.push('TITLE='+await page.title());

          const onboard=page.locator('.her4Onboarding');
          logs.push('ONBOARD_VISIBLE='+await onboard.isVisible().catch(()=>false));
          if(await onboard.isVisible().catch(()=>false)){
            const days=page.locator('.her4Days [data-day]');
            logs.push('DAY_BUTTONS='+await days.count());
            const active=page.locator('.her4Days [data-day].active');
            logs.push('DEFAULT_ACTIVE_DAYS='+await active.count());
            const cont=page.locator('.her4Onboarding [data-next="2"]');
            logs.push('CONT_DISABLED='+await cont.isDisabled());
            await cont.click({timeout:5000});
            await page.waitForTimeout(400);
            logs.push('STEP3_VISIBLE='+await page.locator('.her4Step[data-step="3"]').isVisible().catch(()=>false));
            const create=page.locator('#her4Create');
            logs.push('CREATE_VISIBLE='+await create.isVisible().catch(()=>false));
            await create.click({timeout:5000});
            await page.waitForTimeout(500);
            logs.push('ONBOARD_AFTER_CREATE='+await onboard.isVisible().catch(()=>false));
          }

          const navMap=[['Séances','program'],['Suivi','tracking'],['Mesures','body'],['Guide','more'],['Accueil','home']];
          for(const [name,id] of navMap){
            const b=page.getByRole('button',{name:new RegExp(name,'i')}).last();
            logs.push(`NAV_${name}_COUNT=`+await b.count());
            await b.click({timeout:5000});
            await page.waitForTimeout(200);
            logs.push(`NAV_${name}_ACTIVE=`+await page.locator('.screen:not(.hidden)').getAttribute('id'));
            if((await page.locator('.screen:not(.hidden)').getAttribute('id'))!==id) throw new Error(`nav ${name} failed`);
          }

          const start=page.locator('#her4NextCard .cta').first();
          logs.push('START_VISIBLE='+await start.isVisible().catch(()=>false));
          await start.click({timeout:5000});
          await page.waitForTimeout(300);
          logs.push('AFTER_START='+await page.locator('.screen:not(.hidden)').getAttribute('id'));

          const ex=page.locator('#exerciseList .exerciseRow').first();
          logs.push('EX_VISIBLE='+await ex.isVisible().catch(()=>false));
          await ex.click({timeout:5000});
          await page.waitForTimeout(300);
          logs.push('AFTER_EX='+await page.locator('.screen:not(.hidden)').getAttribute('id'));

          const check=page.locator('#setRows .setCheck').first();
          logs.push('SET_CHECK_VISIBLE='+await check.isVisible().catch(()=>false));
          await check.click({timeout:5000});
          await page.waitForTimeout(250);
          logs.push('TIMER_VISIBLE='+!(await page.locator('#restTimer').evaluate(el=>el.classList.contains('hidden'))));
          logs.push('TIMER_TEXT='+await page.locator('#timerText').innerText());

          await page.getByRole('button',{name:/Guide/i}).last().click({timeout:5000});
          await page.waitForTimeout(250);
          const changeDays=page.getByRole('button',{name:/Changer mes jours/i}).first();
          logs.push('CHANGE_DAYS_VISIBLE='+await changeDays.isVisible().catch(()=>false));
          await changeDays.click({timeout:5000});
          await page.waitForTimeout(300);
          logs.push('RECONFIG_VISIBLE='+await page.locator('.her4Onboarding').isVisible().catch(()=>false));

          console.log(logs.join('\n'));
          console.log('ERRORS='+JSON.stringify(errors));
          if(errors.length) process.exitCode=2;
          await browser.close();
          EOF
          node her12-check.mjs
