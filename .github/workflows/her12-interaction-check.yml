name: HER12 Final Mobile Acceptance

on:
  push:
    branches: [her12-live-check]

jobs:
  validate:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Validate final HER12 mobile release
        run: |
          cat > her12-final.mjs <<'EOF'
          import { chromium } from 'playwright';
          const URL='https://her12-1plk7r.v2.appdeploy.ai/?acceptance=final-v21';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const page=await context.newPage(); page.setDefaultTimeout(12000);
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+(e.stack||e.message)));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          page.on('requestfailed',r=>{if(r.url().includes('her12-1plk7r.v2.appdeploy.ai'))errors.push('REQUEST '+r.url()+' '+(r.failure()?.errorText||''))});
          page.on('dialog',async d=>{await d.accept()});
          const out=s=>console.log('[HER12] '+s);
          async function tap(locator){
            await locator.waitFor({state:'visible'}); await locator.scrollIntoViewIfNeeded();
            const b=await locator.boundingBox(); if(!b)throw new Error('No touch box');
            await page.touchscreen.tap(b.x+b.width/2,b.y+b.height/2); await page.waitForTimeout(130);
          }
          async function createPlan(){
            const root=page.locator('.her4Onboarding'); await root.waitFor({state:'visible',timeout:15000});
            for(const day of ['0','2','4']){const b=root.locator(`.her4Days [data-day="${day}"]`);if(!await b.evaluate(el=>el.classList.contains('active')))await tap(b)}
            await tap(root.locator('[data-step="1"] [data-next="2"]')); await root.locator('.her4Step[data-step="3"]').waitFor({state:'visible'});
            await tap(root.locator('#her4Create')); await root.waitFor({state:'detached'}); await page.locator('#v15ProfileChip').waitFor({state:'visible'});
          }
          async function openBody(){
            await tap(page.locator('.bottom .nav[data-nav="tracking"]')); await tap(page.locator('#v11Progress .v11BodyCard button:visible'));
            await page.locator('#body').waitFor({state:'visible'});
          }
          async function saveWeight(value){
            await page.locator('#mWeight').fill(value); await tap(page.locator('#saveMeasures')); await page.waitForTimeout(150);
            if(await page.locator('#mWeight').inputValue()!==value)throw new Error('weight save failed '+value);
          }
          async function switchToChooser(){
            await tap(page.locator('.bottom .nav[data-nav="more"]'));
            const switcher=page.locator('#v15ChangeProfile'); await switcher.waitFor({state:'visible',timeout:12000});
            const gate=page.locator('.v15ProfileGate').waitFor({state:'visible',timeout:15000});
            await tap(switcher); await gate;
          }
          await page.goto(URL,{waitUntil:'domcontentloaded',timeout:20000});
          await page.locator('.v15ProfileGate').waitFor({state:'visible',timeout:15000});
          if(!await page.locator('[data-sex="female"]').isVisible()||!await page.locator('[data-sex="male"]').isVisible())throw new Error('Femme/Homme choice missing');
          out('fresh gate OK');

          await tap(page.locator('[data-sex="male"]')); await tap(page.locator('[data-run="3"]')); await createPlan();
          let chip=await page.locator('#v15ProfileChip').innerText(); if(!chip.includes('Homme')||!chip.includes('3×'))throw new Error('male chip wrong');
          if(await page.locator('#v15ChangeProfile').count()!==1)throw new Error('direct profile switch missing');
          const size=await page.evaluate(()=>({w:innerWidth,h:innerHeight})); if(size.w!==390||size.h!==844)throw new Error('viewport expanded');
          await tap(page.locator('.bottom .nav[data-nav="program"]'));
          const male=[]; for(let i=0;i<3;i++){await tap(page.locator('#sessionTabs button').nth(i));male.push(await page.locator('#sessionTitle').innerText())}
          if(!male[0].includes('Upper A')||!male[1].includes('Running Strength')||!male[2].includes('Upper B'))throw new Error('male split wrong');
          await tap(page.locator('#sessionTabs button').first()); await tap(page.locator('#exerciseList .exerciseRow').first());
          if(await page.locator('#v6Warmup').isVisible().catch(()=>false))await tap(page.locator('#v6Warmup [data-warm="skip"]'));
          await tap(page.locator('#setRows .setCheck').first()); if(await page.locator('#restTimer').evaluate(el=>el.classList.contains('hidden')))throw new Error('timer missing');
          await tap(page.locator('#timerSkip')); await tap(page.locator('#backExercise'));
          for(const nav of ['tracking','more','home','program']){await tap(page.locator(`.bottom .nav[data-nav="${nav}"]`));if(await page.locator('#'+nav).evaluate(el=>el.classList.contains('hidden')))throw new Error('nav failed '+nav)}
          await tap(page.locator('.bottom .nav[data-nav="tracking"]')); let text=await page.locator('#v11Progress').innerText();
          for(const x of ['Pectoraux','Dos vertical','Dos horizontal','Épaules','Jambes'])if(!text.includes(x))throw new Error('male Suivi missing '+x);
          if(text.includes('Fessiers')||text.includes('Hip Thrust'))throw new Error('female tracking leaked');
          await openBody(); await saveWeight('101.1'); await switchToChooser();
          if(!(await page.locator('[data-sex="male"] small').innerText()).includes('Reprendre'))throw new Error('Homme not saved');
          out('Homme stored');

          await tap(page.locator('[data-sex="female"]')); await createPlan();
          if(!(await page.locator('#v15ProfileChip').innerText()).includes('Femme'))throw new Error('female chip wrong');
          await tap(page.locator('.bottom .nav[data-nav="program"]')); const female=[];
          for(let i=0;i<3;i++){await tap(page.locator('#sessionTabs button').nth(i));female.push(await page.locator('#sessionTitle').innerText())}
          if(female.some(t=>/Upper A|Running Strength|Upper B/.test(t)))throw new Error('male plan leaked female');
          await tap(page.locator('.bottom .nav[data-nav="tracking"]')); text=await page.locator('#v11Progress').innerText();
          if(!text.includes('Fessiers')||!text.includes('Hip Thrust')||text.includes('Dos horizontal')||text.includes('Pectoraux'))throw new Error('female Suivi wrong');
          await openBody(); await saveWeight('62.2'); await switchToChooser();
          if(!(await page.locator('[data-sex="female"] small').innerText()).includes('Reprendre')||!(await page.locator('[data-sex="male"] small').innerText()).includes('Reprendre'))throw new Error('saved profiles missing');
          out('Femme stored');

          await tap(page.locator('[data-sex="male"]')); await page.locator('#v15ProfileChip').waitFor({state:'visible',timeout:15000});
          if(!(await page.locator('#v15ProfileChip').innerText()).includes('Homme'))throw new Error('Homme restore failed');
          await openBody(); if(await page.locator('#mWeight').inputValue()!=='101.1')throw new Error('Homme measurement mixed');
          out('Homme restored');
          await switchToChooser(); await tap(page.locator('[data-sex="female"]')); await page.locator('#v15ProfileChip').waitFor({state:'visible',timeout:15000});
          if(!(await page.locator('#v15ProfileChip').innerText()).includes('Femme'))throw new Error('Femme restore failed');
          await openBody(); if(await page.locator('#mWeight').inputValue()!=='62.2')throw new Error('Femme measurement mixed');
          out('Femme restored');

          const resources=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          if(!resources.some(u=>u.includes('her12-v15.js?v=21')))throw new Error('V15 v21 not loaded');
          const slots=await page.evaluate(()=>JSON.parse(localStorage.getItem('HER12_PROFILE_SLOTS_V16')||'{}'));
          if(!slots.male||!slots.female)throw new Error('profile slots missing');
          if(errors.length)throw new Error(errors.join(' | '));
          await browser.close(); out('HER12_FINAL_ACCEPTANCE_OK');
          EOF
          node her12-final.mjs
